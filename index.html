<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="서울대학교 첨단융합학부 김재홍의 개인 홈페이지입니다.">
  <title>김재홍 | Personal Site</title>
  <style>
    :root { --ink: #18223a; --muted: #5c6881; --line: #dce3f0; --navy: #173d7a; --sky: #eef5ff; --white: #fff; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: #f7f9fc; font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; font-size: 16px; line-height: 1.7; }
    a { color: inherit; }
    .wrap { width: min(100% - 40px, 880px); margin: 0 auto; }
    header { padding: 22px 0; background: rgba(247,249,252,.9); border-bottom: 1px solid var(--line); }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { color: var(--navy); font-size: 1.08rem; font-weight: 800; text-decoration: none; }
    .menu { display: flex; gap: 18px; margin: 0; padding: 0; list-style: none; }
    .menu a { color: var(--muted); font-size: .95rem; font-weight: 600; text-decoration: none; }
    .menu a:hover, .menu a:focus-visible { color: var(--navy); }
    main { padding: 64px 0 48px; }
    .intro { padding: 50px; background: linear-gradient(135deg, #eaf3ff, #fdfefe 72%); border: 1px solid #d9e7fa; border-radius: 24px; }
    .eyebrow { margin: 0 0 12px; color: var(--navy); font-size: .9rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2 { letter-spacing: -.04em; }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 1.1; }
    .lead { max-width: 650px; margin: 24px 0 0; color: #34435e; font-size: clamp(1.05rem, 2.5vw, 1.25rem); }
    section { margin-top: 58px; }
    h2 { margin: 0 0 18px; font-size: 1.65rem; }
    .card { padding: 28px 30px; background: var(--white); border: 1px solid var(--line); border-radius: 18px; }
    .card p { margin: 0; }
    .interests { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag { padding: 8px 14px; color: var(--navy); background: var(--sky); border: 1px solid #d6e6fc; border-radius: 999px; font-size: .95rem; font-weight: 700; }
    .contact-link { display: inline-flex; align-items: center; gap: 8px; color: var(--navy); font-weight: 800; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    footer { padding: 28px 0 38px; color: var(--muted); font-size: .9rem; text-align: center; }
    @media (max-width: 560px) { .wrap { width: min(100% - 32px, 880px); } header { padding: 16px 0; } nav { align-items: flex-start; } .menu { gap: 12px; font-size: .88rem; } main { padding-top: 36px; } .intro { padding: 32px 24px; border-radius: 18px; } section { margin-top: 42px; } .card { padding: 23px; } }
  </style>
</head>
<body>
  <header>
    <nav class="wrap" aria-label="주요 메뉴">
      <a class="brand" href="#top">김재홍</a>
      <ul class="menu"><li><a href="#about">소개</a></li><li><a href="#interests">관심사</a></li><li><a href="#contact">연락처</a></li></ul>
    </nav>
  </header>
  <main id="top" class="wrap">
    <section class="intro" aria-labelledby="home-title">
      <p class="eyebrow">Personal Homepage</p>
      <h1 id="home-title">김재홍</h1>
      <p class="lead">서울대학교 첨단융합학부에 재학 중이며, 새로운 기술과 아이디어를 배우고 연결하는 일에 관심이 있습니다.</p>
    </section>
    <section id="about" aria-labelledby="about-title"><h2 id="about-title">소개</h2><div class="card"><p>안녕하세요. 서울대 첨단융합학부에 재학 중인 김재홍이라고 합니다.</p></div></section>
    <section id="interests" aria-labelledby="interests-title"><h2 id="interests-title">관심사</h2><div class="interests" aria-label="관심 분야"><span class="tag">인공지능</span><span class="tag">융합기술</span><span class="tag">새로운 배움</span></div></section>
    <section id="contact" aria-labelledby="contact-title"><h2 id="contact-title">연락처</h2><div class="card"><p><a class="contact-link" href="https://github.com/hongs0720" target="_blank" rel="noreferrer">GitHub에서 @hongs0720 만나기 <span aria-hidden="true">↗</span></a></p></div></section>
  </main>
  <footer class="wrap">© 2026 김재홍. All rights reserved.</footer>
</body>
</html>
